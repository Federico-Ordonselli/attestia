name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analisi (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
      actions: read # richiesto dall'azione CodeQL per leggere lo stato del run (repo privati)
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        if: matrix.language == 'csharp'
        with:
          global-json-file: global.json
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - name: Build
        if: matrix.build-mode == 'manual'
        run: dotnet build -c Release
      # Repo pubblico: risultati caricati in Code Scanning. Repo privato senza GitHub Advanced Security:
      # il caricamento non e' disponibile, quindi il SARIF diventa un artifact e il job fallisce sugli errori.
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
          upload: ${{ github.event.repository.private && 'never' || 'always' }}
          output: sarif-results
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: codeql-${{ matrix.language }}
          path: sarif-results
          if-no-files-found: ignore
      - name: Nessun risultato di livello "error"
        if: github.event.repository.private
        run: |
          count=$(jq '[.runs[].results[] | select(.level == "error")] | length' sarif-results/*.sarif | paste -sd+ | bc)
          jq -r '.runs[].results[] | "\(.level)\t\(.ruleId)\t\(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine)"' sarif-results/*.sarif
          echo "Risultati di livello error: $count"
          test "$count" -eq 0
