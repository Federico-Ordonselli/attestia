# Ambiente di sviluppo: SQL Server 2022 + Keycloak (IdP SAML 2.0).
# Avvio:  docker compose --env-file .env -f deploy/docker/docker-compose.yml up -d
name: attestia

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Copia .env.example in .env}
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm", "--http-port=8081"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:?Copia .env.example in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?Copia .env.example in .env}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - ./keycloak/realm-attestia.json:/opt/keycloak/data/import/realm-attestia.json:ro
    healthcheck:
      # L'immagine non ha curl: si usa /dev/tcp di bash sulla porta di management.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s

volumes:
  mssql-data:
